<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer — BankSys</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-building-columns"></i></span> BankSys</a>
  <div class="nav-links" data-nav-links>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="transfer.html" class="active">Transfer</a>
    <a href="transactions.html">Transactions</a>
  </div>
  <div class="nav-tools">
    <button class="icon-btn" data-theme-toggle title="Toggle theme"></button>
    <button class="icon-btn nav-burger" data-nav-burger title="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
</nav>

<section class="hero-simple">
  <div class="hero-simple-row">
    <div class="glyph"><i class="fa-solid fa-arrow-right-arrow-left"></i></div>
    <div>
      <span class="eyebrow">Account to account</span>
      <h1 style="margin:0;">Transfer funds</h1>
    </div>
  </div>
</section>

<main class="page-main" style="padding-top:10px;">
  <div class="wrap">
    <div class="passbook wide reveal">
      <form id="transferForm" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="from_account">From account ID</label>
            <input type="number" id="from_account" placeholder="Sender account ID" required>
          </div>
          <div class="field">
            <label for="to_account">To account ID</label>
            <input type="number" id="to_account" placeholder="Recipient account ID" required>
          </div>
        </div>
        <div class="field">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" min="1" step="0.01" placeholder="0.00" required>
        </div>
        <div class="field">
          <label for="pin">Sender's PIN</label>
          <input type="password" id="pin" maxlength="6" placeholder="4–6 digit PIN" required>
        </div>
        <button class="btn block" type="submit">Transfer</button>
      </form>
      <a href="index.html" style="display:block; margin-top:16px; text-align:center; font-size:.9rem; color:var(--text-low);">Cancel</a>
    </div>
  </div>
</main>

<footer class="footer">BankSys — Vault Ledger UI · Backend: Python + SQLite</footer>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/pages/transfer.js"></script>
</body>
</html>
