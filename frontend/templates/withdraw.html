<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Withdraw</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="nav-left">
    🏦 <span>BankSys</span>
  </div>
  <div class="nav-right">
    <a href="index.html">Home</a>
    <a href="create_account.html">Create</a>
    <a class="active" href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="transfer.html">Transfer</a>
    <a href="transactions.html">Transactions</a>
    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>
</nav>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <h1>Withdraw Funds</h1>
<p>Withdraw money securely from your account</p>
    </div>
    <div class="hero-visual">🏧</div>
  </div>
</section>

<!-- ================= MAIN ================= -->
<main class="main">

  <div class="actions-grid" style="grid-template-columns: 1fr; max-width: 480px; margin:auto;">

    <div class="action-card card-withdraw">

      <h3>Deposit Amount</h3>

      <form action="/api/withdraw" method="post">

        <label>Account ID</label>
        <input type="number" name="account_id" required>

        <label>Amount</label>
        <input type="number" name="amount" required>

        <label>PIN</label>
        <input type="password" name="pin" required>

        <button class="btn" type="submit">Withdraw</button>
      </form>

      <a href="index.html" style="display:block;margin-top:15px;text-align:center;color:#64748b;">
        Cancel
      </a>

    </div>

  </div>

</main>

<!-- ================= FOOTER ================= -->
<footer class="footer">
  Secure Deposit • BankSys
</footer>

<script>
  const toggle = document.getElementById("themeToggle");
  toggle.onclick = () => {
    document.body.classList.toggle("dark");
    toggle.textContent =
      document.body.classList.contains("dark") ? "☀️" : "🌙";
  };
</script>

</body>

</html>
