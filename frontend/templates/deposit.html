<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deposit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../static/css/styles.css">

</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="nav-left">
    🏦 <span>BankSys</span>
  </div>
  <div class="nav-right">
    <a href="index.html">Home</a>
    <a href="create_account.html">Create</a>
    <a class="active" href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="transfer.html">Transfer</a>
    <a href="transactions.html">Transactions</a>
    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>
</nav>


<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <h1>Deposit Funds</h1>
      <p>Add money securely to a bank account</p>
    </div>
    <div class="hero-visual">💰</div>
  </div>
</section>

<!-- ================= MAIN ================= -->
<main class="main">
  <div class="actions-grid" style="grid-template-columns: 1fr; max-width: 480px; margin:auto;">
    <div class="action-card card-deposit">
      <h3>Deposit Amount</h3>
      <form action="/deposit" method="post">
        <label>Account ID</label>
        <input type="number" name="account_id" placeholder="Enter account ID" required>

        <label>Amount</label>
        <input type="number" name="amount" placeholder="Enter amount (₹)" required>
        <small style="color:#64748b;">
          Enter amount greater than ₹0
        </small>
        <button class="btn" type="submit" style="width:100%;">
          Deposit
        </button>
      </form>
      <a href="index.html" style="display:block;margin-top:15px;text-align:center;color:#64748b;">
        Cancel
      </a>
    </div>
  </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="footer">
  Secure Deposit • BankSys
</footer>
<script src="../static/js/app.js"></script>
</body>
</html>
