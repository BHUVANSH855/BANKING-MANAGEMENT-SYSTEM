<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>

<header class="topbar glass">
  <h2>🏦 Admin Dashboard</h2>
  <button onclick="logoutAdmin()" class="btn danger">Logout</button>
</header>

<main class="dashboard">

  <!-- STATS -->
  <section class="card glass">
    <h3>Bank Stats</h3>
    <p>Total Users: <span id="totalUsers"></span></p>
    <p>Total Deposits: ₹<span id="totalDeposits"></span></p>
    <p>Total Withdrawals: ₹<span id="totalWithdrawals"></span></p>
  </section>

  <!-- USERS -->
  <section class="card glass">
    <h3>Users</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Balance</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </section>

</main>

<script src="../static/js/app.js"></script>
<script>
if (!localStorage.getItem("admin")) {
  window.location.href = "admin_login.html";
}

const pin = prompt("Enter admin PIN");

apiRequest("/admin/stats", "POST", { pin }).then(data => {
  totalUsers.textContent = data.total_users;
  totalDeposits.textContent = data.total_deposits;
  totalWithdrawals.textContent = data.total_withdrawals;
});

apiRequest("/admin/users", "POST", { pin }).then(users => {
  const tbody = document.getElementById("usersTable");
  users.forEach(u => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${u.account_id}</td>
      <td>${u.name}</td>
      <td>₹${u.balance}</td>
      <td>${u.status}</td>
      <td>
        <button onclick="toggle(${u.account_id})" class="btn danger">Toggle</button>
      </td>
    `;
    tbody.appendChild(row);
  });
});

function toggle(id) {
  apiRequest("/admin/toggle-lock", "POST", { pin, account_id: id })
    .then(() => location.reload());
}

function logoutAdmin() {
  localStorage.removeItem("admin");
  window.location.href = "admin_login.html";
}
</script>

</body>
</html>
