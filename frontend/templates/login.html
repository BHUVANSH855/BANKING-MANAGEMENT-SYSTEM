<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – BankSys</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="../static/css/styles.css">

</head>

<body>

<nav class="navbar">
  <div class="nav-left">
    🏦 <span>BankSys</span>
  </div>
</nav>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <h1>Login</h1>
      <p>Access your bank account securely</p>
    </div>
    <div class="hero-visual">🔐</div>
  </div>
</section>

<main class="main">
  <div class="actions-grid" style="grid-template-columns: 1fr; max-width: 420px; margin:auto;">
    <div class="action-card">

      <form action="/login" method="post">
        <label>Account ID</label>
        <input type="number" name="account_id" placeholder="Enter account id" required>

        <label>PIN</label>
        <input type="password" name="pin" placeholder="Enter PIN" required>

        <button class="btn primary" style="width:100%;">Login</button>
      </form>

    </div>
  </div>
</main>

<footer class="footer">
  Secure Login • BankSys
</footer>
<script src="../static/js/app.js"></script>
</body>
</html>
