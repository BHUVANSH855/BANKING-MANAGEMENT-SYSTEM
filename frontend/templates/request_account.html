<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Opening Request | BankSys</title>
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">🏦 BankSys</div>
</nav>

<div class="page-wrapper">
  <div class="action-card center-card large">

    <h2>Account Opening Request</h2>
    <p class="subtitle">
      Submit your details to request a new bank account.
      Our admin will verify and approve your request.
    </p>

    <form action="/request_account" method="post">

      <!-- SAME FIELDS AS CREATE ACCOUNT UI MODEL -->

      <label>Full Name</label>
      <input name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone</label>
      <input name="phone" required>

      <label>Initial Deposit</label>
      <input type="number" name="initial_balance" placeholder="Minimum ₹500" required>

      <label>Create PIN</label>
      <input type="password" name="pin" placeholder="4–6 digit PIN" required>

      <label>Account Purpose</label>
      <input name="purpose" placeholder="Savings / Salary / Student">

      <button type="submit">Submit Request</button>

    </form>

  </div>
</div>

<script src="../JS/app.js"></script>
</body>
</html>
