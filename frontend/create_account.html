<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — BankSys</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-building-columns"></i></span> BankSys</a>
  <div class="nav-links" data-nav-links>
    <a href="index.html">Home</a>
    <a href="create_account.html" class="active">Create</a>
    <a href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="transfer.html">Transfer</a>
    <a href="transactions.html">Transactions</a>
  </div>
  <div class="nav-tools">
    <button class="icon-btn" data-theme-toggle title="Toggle theme"></button>
    <button class="icon-btn nav-burger" data-nav-burger title="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
</nav>

<section class="hero-simple">
  <div class="hero-simple-row">
    <div class="glyph"><i class="fa-solid fa-user-plus"></i></div>
    <div>
      <span class="eyebrow">New ledger entry</span>
      <h1 style="margin:0;">Create an account</h1>
    </div>
  </div>
</section>

<main class="page-main" style="padding-top:10px;">
  <div class="wrap">
    <div class="passbook wide reveal">
      <p style="margin-bottom:22px;">Fill in your details carefully — your account ID and PIN will be your keys to the ledger.</p>

      <form id="createForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Enter full name" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="phone">Phone number</label>
            <input type="text" id="phone" placeholder="10 digit mobile number" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="deposit">Initial deposit (₹)</label>
            <input type="number" id="deposit" min="0" step="0.01" placeholder="Minimum ₹500" required>
          </div>
          <div class="field">
            <label for="pin">Create PIN</label>
            <input type="password" id="pin" maxlength="6" placeholder="4–6 digit PIN" required>
          </div>
        </div>
        <button class="btn block" type="submit">Create account</button>
      </form>
    </div>
  </div>
</main>

<footer class="footer">BankSys — Vault Ledger UI · Backend: Python + SQLite</footer>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/pages/create-account.js"></script>
</body>
</html>
