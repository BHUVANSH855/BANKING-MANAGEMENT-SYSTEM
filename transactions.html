<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Transactions – BankSys</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="nav-left">
    🏦 <span>BankSys</span>
  </div>
  <div class="nav-right">
    <a href="index.html">Home</a>
    <a href="create_account.html">Create</a>
    <a href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="transfer.html">Transfer</a>
    <a class="active" href="transactions.html">Transactions</a>
    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>
</nav>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <h1>Transaction History</h1>
      <p>View all deposits, withdrawals and transfers</p>
    </div>
    <div class="hero-visual">📊</div>
  </div>
</section>

<!-- ================= MAIN ================= -->
<main class="main">

  <div class="actions-grid" style="grid-template-columns: 1fr;">

    <div class="action-card card-transactions">

      <h3>Search Transactions</h3>

      <form id="txForm">

        <label>Account ID</label>
        <input type="number" name="account_id" placeholder="Enter account ID" required>

        <button class="btn secondary" type="submit" style="width:100%;">
          Load Transactions
        </button>

      </form>

      <div id="loader" style="display:none;margin:15px 0;text-align:center;">
        Loading...
      </div>

      <div style="margin-top:20px;overflow-x:auto;">
        <table class="table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Balance</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="txBody">
            <!-- Filled by JS -->
          </tbody>
        </table>
      </div>

    </div>

  </div>

</main>

<!-- ================= FOOTER ================= -->
<footer class="footer">
  Transaction Records • BankSys
</footer>

<script>
  const toggle = document.getElementById("themeToggle");
  toggle.onclick = () => {
    document.body.classList.toggle("dark");
    toggle.textContent =
      document.body.classList.contains("dark") ? "☀️" : "🌙";
  };

  const form = document.getElementById("txForm");
  const txBody = document.getElementById("txBody");
  const loader = document.getElementById("loader");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = form.account_id.value;
    if (!id) return;

    loader.style.display = "block";
    txBody.innerHTML = "";

    try {
      const res = await fetch("/api/transactions/" + encodeURIComponent(id));
      if (!res.ok) throw new Error("Failed to load");

      const data = await res.json();
      data.forEach(t => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${t.created_at}</td>
          <td>${t.type}</td>
          <td>${t.amount}</td>
          <td>${t.balance_after}</td>
          <td>${t.note || ""}</td>
        `;
        txBody.appendChild(tr);
      });
    } catch (err) {
      alert("Could not load transactions");
    } finally {
      loader.style.display = "none";
    }
  });
</script>

</body>
</html>
